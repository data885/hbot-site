services:
  - type: web
    name: hbot-site
    runtime: static
    staticPublishPath: ./site
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: X-DNS-Prefetch-Control
        value: "off"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), microphone=(), camera=(), payment=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://cdnjs.cloudflare.com https://static.cloudflareinsights.com https://www.clarity.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://formspree.io https://open.er-api.com https://crmalmita.com https://script.google.com https://script.googleusercontent.com https://cloudflareinsights.com https://www.google-analytics.com https://region1.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://stats.g.doubleclick.net https://ad.doubleclick.net https://www.google.com https://www.google.com.tr https://www.google.ae https://www.google.com.sa https://www.google.ru https://www.google.de https://www.google.es https://www.google.pt https://*.clarity.ms; frame-src 'self' https://td.doubleclick.net https://www.googletagmanager.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://formspree.io https://script.google.com; object-src 'none'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests"

      # --- Cache-Control -------------------------------------------------
      # HTML icin kural YOK: Render varsayilani (max-age=0, s-maxage=300)
      # korunur, boylece icerik degisikligi aninda yayina girer.
      #
      # JS/CSS: URL'lerde ?v=NN cache-bust'i var (AGENTS.md kural 5), bu yuzden
      # bir yil guvenli. "immutable" BILEREK YOK: biri ?v'yi bumplamadan
      # main.js'i guncellerse immutable ile geri gelen ziyaretci bir yil eski
      # konfiguratorde kalir ve reload bile kurtarmaz. immutable'siz uzun cache
      # ayni performansi verir, ama hatali deploy'dan reload ile cikilabilir.
      - path: /assets/js/*
        name: Cache-Control
        value: "public, max-age=31536000"
      - path: /assets/css/*
        name: Cache-Control
        value: "public, max-age=31536000"
      # Fontlar hicbir zaman degismiyor — burada immutable guvenli.
      - path: /assets/fonts/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      # Gorsel/video/AR: bir kismi surumsuz (logo, favicon, hero) — bilerek
      # immutable DEGIL; 7 gun sonra kendini toparlar.
      - path: /assets/img/*
        name: Cache-Control
        value: "public, max-age=604800"
      - path: /assets/video/*
        name: Cache-Control
        value: "public, max-age=604800"
      - path: /assets/ar/*
        name: Cache-Control
        value: "public, max-age=604800"
      # Uretilen PDF'ler yeniden basiliyor — 1 gun.
      - path: /assets/docs/*
        name: Cache-Control
        value: "public, max-age=86400"
      - path: /assets/downloads/*
        name: Cache-Control
        value: "public, max-age=86400"

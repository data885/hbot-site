<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<style>
  body { background: #1c2430; margin: 0; padding: 16px; font-family: sans-serif; color: #fff; }
  .row { display: flex; gap: 12px; margin-bottom: 6px; }
  .cell { width: 340px; }
  .cell h3 { margin: 0 0 4px; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stage { position: relative; width: 340px; height: 340px; border-radius: 10px; overflow: hidden; background: #0d1319; }
  .base { position: absolute; inset: 0; background-repeat: no-repeat; background-position: center; background-size: cover; }
  .tint {
    position: absolute; inset: 0;
    background-repeat: no-repeat; background-position: center; background-size: cover;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
    -webkit-mask-size: cover; mask-size: cover;
  }
  .ext .stage { height: 255px; }
  .ext .base, .ext .tint { background-size: contain; -webkit-mask-size: contain; mask-size: contain; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const IC = "real/geneva-interior";
const CASES = [
  // [label, image, mask, filter, extMode]
  ["İÇ orijinal (cream/null)", IC, "masks/int-nexus", null, false],
  ["İÇ Kum Beji: gr(.5) sep(.6) sat(1.6) bri(.95)", IC, "masks/int-nexus", "grayscale(0.5) sepia(0.6) saturate(1.6) brightness(0.95)", false],
  ["İÇ Konyak: gr(.6) sep hr(-15) sat(2) bri(.7)", IC, "masks/int-nexus", "grayscale(0.6) sepia(1) hue-rotate(-15deg) saturate(2) brightness(0.7)", false],
  ["İÇ Antrasit: gr(.8) bri(.5) con(1.05)", IC, "masks/int-nexus", "grayscale(0.8) brightness(0.5) contrast(1.05)", false],
  ["İÇ Bordo: gr(.8) sep hr(-50) sat(3.2) bri(.45)", IC, "masks/int-nexus", "grayscale(0.8) sepia(1) hue-rotate(-50deg) saturate(3.2) brightness(0.45)", false],
  ["İÇ Lacivert: gr(.8) sep hr(190) sat(3) bri(.5)", IC, "masks/int-nexus", "grayscale(0.8) sepia(1) hue-rotate(190deg) saturate(3) brightness(0.5)", false],
  ["KOLTUK Konyak", IC, "masks/seat-nexus", "grayscale(0.6) sepia(1) hue-rotate(-15deg) saturate(2) brightness(0.7)", false],
  ["KOLTUK Krem: gr(.4) sep(.4) sat(1.3) bri(1.05)", IC, "masks/seat-nexus", "grayscale(0.4) sepia(0.4) saturate(1.3) brightness(1.05)", false],
  ["KOLTUK Siyah: gr(.8) bri(.32) con(1.1)", IC, "masks/seat-nexus", "grayscale(0.8) brightness(0.32) contrast(1.1)", false],
  ["KOLTUK Lacivert", IC, "masks/seat-nexus", "grayscale(0.8) sepia(1) hue-rotate(190deg) saturate(3) brightness(0.5)", false],
  ["KOLTUK Bordo", IC, "masks/seat-nexus", "grayscale(0.8) sepia(1) hue-rotate(-50deg) saturate(3.2) brightness(0.45)", false],
  ["KOLTUK Gri: gr(.8) bri(.7)", IC, "masks/seat-nexus", "grayscale(0.8) brightness(0.7)", false],
  ["DIŞ Bronz v2 (amber baz duo)", "spin/duo/frame-00", "masks/spin-duo", "grayscale(0.8) sepia(1) hue-rotate(-22deg) saturate(2.4) brightness(0.5)", true],
  ["DIŞ Bronz v2 (nexus)", "spin/nexus/frame-00", "masks/spin-nexus", "grayscale(0.8) sepia(1) hue-rotate(-22deg) saturate(2.4) brightness(0.5)", true],
  ["DIŞ Şampanya (duo)", "spin/duo/frame-00", "masks/spin-duo", "grayscale(0.4) sepia(0.7) saturate(2) brightness(1)", true]
];
const app = document.getElementById("app");
for (let r = 0; r < CASES.length; r += 3) {
  const row = document.createElement("div");
  row.className = "row";
  CASES.slice(r, r + 3).forEach(([label, img, mask, filter, ext]) => {
    const cell = document.createElement("div");
    cell.className = "cell" + (ext ? " ext" : "");
    const tint = filter
      ? `<div class="tint" style="background-image:url('assets/img/models/${img}.webp');filter:${filter};-webkit-mask-image:url('assets/img/models/${mask}.png');mask-image:url('assets/img/models/${mask}.png')"></div>`
      : "";
    cell.innerHTML = `<h3>${label}</h3><div class="stage"><div class="base" style="background-image:url('assets/img/models/${img}.webp')"></div>${tint}</div>`;
    row.appendChild(cell);
  });
  app.appendChild(row);
}
</script>
</body>
</html>
